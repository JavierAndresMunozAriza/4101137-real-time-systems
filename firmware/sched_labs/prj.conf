CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
# 1 ms tick: the task set is expressed in whole milliseconds.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
# main only starts the scenario and prints; it must sit below every task.
CONFIG_MAIN_THREAD_PRIORITY=10
CONFIG_MAIN_STACK_SIZE=2048
# Equal-priority threads must not be time-sliced: EDF orders them by deadline.
CONFIG_TIMESLICING=n
