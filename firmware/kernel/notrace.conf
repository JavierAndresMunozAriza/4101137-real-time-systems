# Lab 05, Task C — "the price of looking": tracing OFF for the A/B jitter run.
#   tracing ON : west build -p auto -b esp32s3_devkitc/esp32s3/procpu firmware/kernel
#   tracing OFF: west build -p always -b esp32s3_devkitc/esp32s3/procpu firmware/kernel \
#                  -- -DEXTRA_CONF_FILE=notrace.conf
# Everything else (threads, priorities, GPIO instrumentation) stays identical.
# Kconfig prints two "choice symbol ... was selected" warnings because prj.conf
# still sets the CTF/UART choices; the merged .config has TRACING off (verified).
CONFIG_TRACING=n
CONFIG_TRACING_CTF=n
CONFIG_TRACING_BACKEND_UART=n
