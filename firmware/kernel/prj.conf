CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_IDLE_STACK_SIZE=256
CONFIG_ISR_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_THREAD_PRIORITY=10
CONFIG_MULTITHREADING=y
CONFIG_THREAD_ANALYZER=y
CONFIG_INIT_STACKS=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=10
# Lab 05: with CTF tracing on, the analyzer thread needs ~1.2 KB of stack; the 1024 B
# default overflows and crashes the board in z_swap shortly after boot.
CONFIG_THREAD_ANALYZER_AUTO_STACK_SIZE=2048
# Per-thread CPU usage (%) in the analyzer output: Lab 05, "CPU load per thread"
CONFIG_THREAD_RUNTIME_STATS=y
# Habilitar Tracing y Nombres de Hilos (Task A)
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MAX_NAME_LEN=20

CONFIG_TRACING=y
CONFIG_TRACING_CTF=y
# CTF over the USB-Serial-JTAG port (USB jack); console stays on the UART jack
CONFIG_TRACING_BACKEND_UART=y
